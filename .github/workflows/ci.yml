name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: wasm-tools@1.252.0
      - run: cargo install b3sum --version 1.8.2 --locked
      - run: ./scripts/check-contracts.sh
      - run: ./scripts/check-sql-reproducible.sh
