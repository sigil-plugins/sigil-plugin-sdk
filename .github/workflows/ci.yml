name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.252.0
      - run: cargo install b3sum --version 1.8.2 --locked
      - run: ./scripts/check-contracts.sh
