[package]
name = "sigil-plugin-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reference bindings and conformance helpers for Sigil Component Model plugins"
repository = "https://github.com/sigil-plugins/sigil-plugin-sdk"

[dependencies]
serde = { version = "1", features = ["derive"] }
wit-bindgen = "0.57.1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
