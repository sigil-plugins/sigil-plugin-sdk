[package]
name = "sigil-plugin-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reference bindings and conformance helpers for Sigil Component Model plugins"
repository = "https://github.com/sigil-plugins/sigil-plugin-sdk"

[workspace]
members = [".", "fixtures/sql-v01", "fixtures/sql-v02"]
default-members = ["."]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
wit-bindgen = "0.57.1"

[dev-dependencies]
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
